name: Offline source and tooling checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact original source bytes
        run: python scripts/verify_original_sources.py
      - name: Verify all original comments
        run: python scripts/extract_original_comments.py --check
      - name: Test offline tooling
        run: python -m unittest discover -s tests -v
